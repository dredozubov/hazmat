integration:
  name: bun
  version: 1
  description: JavaScript/TypeScript project using Bun

detect:
  files: [bun.lockb, bun.lock, bunfig.toml]

session:
  read_dirs:
    - ~/.bun
  env_passthrough: [BUN_INSTALL, NODE_ENV]

backup:
  excludes:
    - node_modules/
    - dist/
    - build/
    - out/
    - .next/
    - .nuxt/
    - .vercel/
    - .turbo/
    - .vite/
    - .svelte-kit/
    - .astro/
    - .angular/cache/
    - .parcel-cache/
    - coverage/
    - playwright-report/
    - test-results/

commands:
  test: bun test
  build: bun run build
  install: bun install
