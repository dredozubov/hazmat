integration:
  name: flutter
  version: 1
  description: Flutter or pure-Dart project (uses pub)

detect:
  files: [pubspec.yaml]

session:
  read_dirs:
    - ~/.pub-cache
    - ~/.dart
    - ~/.dart-tool
  env_passthrough: [FLUTTER_ROOT, PUB_CACHE]

warnings:
  - "The Flutter SDK at /opt/homebrew/share/flutter is a git checkout. When invoked as the sandboxed agent user, flutter's bootstrap fails with 'fatal: detected dubious ownership in repository'. Workaround: configure git to trust the SDK dir for the agent ('sudo -u agent git config --global --add safe.directory /opt/homebrew/share/flutter') or invoke the bundled dart at /opt/homebrew/share/flutter/bin/cache/dart-sdk/bin/dart directly."
  - "Online 'dart pub get' / 'flutter pub get' may hit a TLS verification failure against pub.dev because Dart's ssl stack goes through Apple's SecureTransport. This is the same MacOSNativeTLS surface that codex needs; non-network commands and offline caching are unaffected."

backup:
  excludes:
    - build/
    - .dart_tool/
    - .flutter-plugins
    - .flutter-plugins-dependencies
    - ios/Pods/
    - android/.gradle/
    - android/build/

commands:
  test: flutter test
  build: flutter build apk
  run: flutter run
