name: Linux evidence

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Linux evidence lane to run
        required: true
        type: choice
        options:
          - all
          - current-user
          - agent-user-scaffold
        default: all
      run_live:
        description: Run live Ubuntu current-user smoke
        required: false
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GO_VERSION_FILE: hazmat/go.mod
  GO_CACHE_DEP: hazmat/go.sum
  HAZMAT_LINUX_VM_RUNNER: github-actions-ubuntu-latest

jobs:
  current-user-ubuntu:
    name: Current-user Ubuntu evidence
    if: ${{ github.event_name == 'push' || github.event.inputs.lane == 'all' || github.event.inputs.lane == 'current-user' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_CACHE_DEP }}

      - name: Capture current-user transcript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p linux-evidence
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event.inputs.run_live }}" == "true" ]]; then
            scripts/check-linux-current-user-live-smoke.sh \
              --run \
              --i-understand-this-runs-linux-current-user-live-smoke \
              | tee linux-evidence/current-user-ubuntu.txt
          else
            scripts/check-linux-vm-matrix-transcript.sh \
              --mode current-user \
              --run \
              --skip-preflight \
              | tee linux-evidence/current-user-ubuntu.txt
          fi

      - name: Upload current-user evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-current-user-ubuntu-evidence
          path: linux-evidence/current-user-ubuntu.txt
          if-no-files-found: warn

  agent-user-scaffold-ubuntu:
    name: Agent-user Ubuntu transcript scaffold
    if: ${{ github.event_name == 'push' || github.event.inputs.lane == 'all' || github.event.inputs.lane == 'agent-user-scaffold' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_CACHE_DEP }}

      - name: Capture agent-user scaffold transcript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p linux-evidence
          scripts/check-linux-vm-matrix-transcript.sh \
            --mode agent-user \
            --run \
            --skip-preflight \
            | tee linux-evidence/agent-user-ubuntu-scaffold.txt

      - name: Upload agent-user scaffold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-agent-user-ubuntu-scaffold
          path: linux-evidence/agent-user-ubuntu-scaffold.txt
          if-no-files-found: warn
