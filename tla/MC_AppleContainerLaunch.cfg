\* Model configuration for MC_AppleContainerLaunch
\*
\* Run:
\*   ./run_tlc.sh -workers auto -config MC_AppleContainerLaunch.cfg MC_AppleContainerLaunch.tla

SPECIFICATION Spec

CONSTANTS
    workspaceRoot   = workspaceRoot
    projectRoot     = projectRoot
    projectSub      = projectSub
    safeRef         = safeRef
    safeRefChild    = safeRefChild
    invokerHome     = invokerHome
    sshDir          = sshDir
    awsDir          = awsDir
    aiCredentialDir = aiCredentialDir
    gooseStateDir   = gooseStateDir
    agentHome       = agentHome
    agentSecretsDir = agentSecretsDir

    Paths = {
        workspaceRoot,
        projectRoot,
        projectSub,
        safeRef,
        safeRefChild,
        invokerHome,
        sshDir,
        awsDir,
        aiCredentialDir,
        gooseStateDir,
        agentHome,
        agentSecretsDir
    }

    CredentialLeaves = {sshDir, awsDir, aiCredentialDir, gooseStateDir, agentSecretsDir}
    ProjectChoices   = {projectRoot, projectSub, invokerHome, sshDir, aiCredentialDir, gooseStateDir, agentHome}
    ReadChoices      = {workspaceRoot, projectSub, safeRef, safeRefChild, invokerHome, aiCredentialDir, gooseStateDir, agentHome}

    NetworkModes          = {"default", "none", "allowlist"}
    SupportedNetworkModes = {"default"}

INVARIANTS
    TypeOK
    CredentialPathsNeverMounted
    InvokerHomeNeverMounted
    AgentHomeNeverMountedWholesale
    ProjectMountedRW
    PlannedReadDirsMountedRO
    CoveredReadDirsOmitted
    NoUnexpectedLaunchEnv
    IntegrationEnvRejected
    SSHForwardingRejected
    SocketPublishingRejected
    AdmissionBeforeLaunch
    UnsupportedNetworkFailsClosed
    CredentialMaterializationGated
    CredentialArtifactSessionScoped
    TerminalCredResidueHandled
    TerminalContainerHandled
    ForeignContainersUntouched
