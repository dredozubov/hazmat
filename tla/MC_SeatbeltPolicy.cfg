\* Model configuration for MC_SeatbeltPolicy
\*
\* Run:
\*   ./run_tlc.sh -workers auto -config MC_SeatbeltPolicy.cfg MC_SeatbeltPolicy.tla

SPECIFICATION Spec

CONSTANTS
    normalProj  = normalProj
    agentHome   = agentHome
    sessionHome = sessionHome
    sessionHomeOtherFile = sessionHomeOtherFile
    configDir   = configDir
    sshDir      = sshDir
    gcloudDir   = gcloudDir
    aiCredentialDir = aiCredentialDir
    ampConfigDir = ampConfigDir
    devinConfigDir = devinConfigDir
    agentCliStateDir = agentCliStateDir
    gooseStateDir = gooseStateDir
    keychainDir = keychainDir
    keychainDB  = keychainDB
    keychainSHM = keychainSHM
    keychainWAL = keychainWAL
    outsideRef  = outsideRef
    invokerSess = invokerSess
    hostTempRoot = hostTempRoot
    hostTempOutside = hostTempOutside
    sessionTempRoot = sessionTempRoot
    sessionTempFile = sessionTempFile
    antigravityStateDir = antigravityStateDir
    agentStateFile = agentStateFile
    agentLocalDir = agentLocalDir
    agentOtherFile = agentOtherFile
    claudeTempRoot = claudeTempRoot
    claudeTempFile = claudeTempFile
    codexTempSocket = codexTempSocket
    attestationKeyDir  = attestationKeyDir
    attestationKeyFile = attestationKeyFile

    Paths         = {normalProj, agentHome, sessionHome, sessionHomeOtherFile, configDir, sshDir, gcloudDir, aiCredentialDir, ampConfigDir, devinConfigDir, agentCliStateDir, gooseStateDir, keychainDir, keychainDB, keychainSHM, keychainWAL, outsideRef, invokerSess, hostTempRoot, hostTempOutside, sessionTempRoot, sessionTempFile, antigravityStateDir, agentStateFile, agentLocalDir, agentOtherFile, claudeTempRoot, claudeTempFile, codexTempSocket, attestationKeyDir, attestationKeyFile}
    CredPaths     = {sshDir, gcloudDir, aiCredentialDir, ampConfigDir, devinConfigDir, agentCliStateDir, gooseStateDir, keychainDir}
    CredentialTargets = {sshDir, gcloudDir, aiCredentialDir, ampConfigDir, devinConfigDir, agentCliStateDir, gooseStateDir, keychainDir, keychainDB, keychainSHM, keychainWAL}
    AgentKeychainExceptionPaths = {keychainDB, keychainSHM, keychainWAL}
    AgentHomeSubs = {configDir, antigravityStateDir, agentLocalDir}
    AgentHomeFiles = {agentStateFile}
    \* attestationKeyDir is included as a Project/Read choice so TLC actually exercises
    \* "key dir chosen as ProjectDir / a ReadDir" and proves the section-8 deny dominates.
    ProjectChoices = {normalProj, agentHome, sessionHome, sshDir, aiCredentialDir, ampConfigDir, devinConfigDir, agentCliStateDir, gooseStateDir, configDir, hostTempRoot, hostTempOutside, attestationKeyDir}
    ReadChoices    = {normalProj, agentHome, sessionHome, aiCredentialDir, ampConfigDir, devinConfigDir, agentCliStateDir, gooseStateDir, outsideRef, hostTempRoot, attestationKeyDir}
    NetworkChoices = {"default", "none"}
    HomeChoices    = {"persistent", "session"}
    ResumeChoices  = {invokerSess, outsideRef, "none"}
    TempSocketPaths = {codexTempSocket}
    HostAuthorityPaths   = {attestationKeyDir}
    HostAuthorityTargets = {attestationKeyDir, attestationKeyFile}

INVARIANTS
    TypeOK
    CredentialReadDenied
    CredentialWriteDenied
    AttestationKeyReadDenied
    AttestationKeyWriteDenied
    AgentKeychainExceptionScoped
    ReadDirsNoWrite
    NoBroadAgentHomeAllow
    AgentHomeSubsUsable
    AgentHomeFilesUsable
    SessionHomeUsableWhenActive
    SessionHomeSeparateFromCredentials
    PersistentAgentHomeNotImplicitlyExposedWhenSessionHome
    UnlistedAgentHomeNotImplicitlyReadable
    UnlistedAgentHomeNotImplicitlyWritable
    UnlistedAgentHomeNotImplicitlyExecutable
    ProjectDirWritable
    ReadDirSubsumption
    ResumeDirNotCredential
    HostTempNotImplicitlyReadable
    HostTempNotImplicitlyWritable
    HostTempNotImplicitlyExecutable
    SessionTempWritable
    ClaudeRuntimeTempScoped
    TempSocketsDenied
    NetworkNoneDeniesOutbound
    NetworkNoneDeniesDNS
    NetworkDefaultAllowsOutbound
