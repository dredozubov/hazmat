\* Model configuration for MC_SeatbeltPolicy
\*
\* Run:
\*   ./run_tlc.sh -workers auto -config MC_SeatbeltPolicy.cfg MC_SeatbeltPolicy.tla

SPECIFICATION Spec

CONSTANTS
    normalProj  = normalProj
    agentHome   = agentHome
    configDir   = configDir
    sshDir      = sshDir
    gcloudDir   = gcloudDir
    keychainDir = keychainDir
    keychainDB  = keychainDB
    keychainSHM = keychainSHM
    keychainWAL = keychainWAL
    outsideRef  = outsideRef
    invokerSess = invokerSess
    hostTempRoot = hostTempRoot
    hostTempOutside = hostTempOutside
    sessionTempRoot = sessionTempRoot
    sessionTempFile = sessionTempFile
    agentStateDir = agentStateDir
    agentLocalDir = agentLocalDir
    agentOtherFile = agentOtherFile
    claudeTempRoot = claudeTempRoot
    claudeTempFile = claudeTempFile
    codexTempSocket = codexTempSocket
    attestationKeyDir  = attestationKeyDir
    attestationKeyFile = attestationKeyFile

    Paths         = {normalProj, agentHome, configDir, sshDir, gcloudDir, keychainDir, keychainDB, keychainSHM, keychainWAL, outsideRef, invokerSess, hostTempRoot, hostTempOutside, sessionTempRoot, sessionTempFile, agentStateDir, agentLocalDir, agentOtherFile, claudeTempRoot, claudeTempFile, codexTempSocket, attestationKeyDir, attestationKeyFile}
    CredPaths     = {sshDir, gcloudDir, keychainDir}
    CredentialTargets = {sshDir, gcloudDir, keychainDir, keychainDB, keychainSHM, keychainWAL}
    AgentKeychainExceptionPaths = {keychainDB, keychainSHM, keychainWAL}
    AgentHomeSubs = {configDir, agentStateDir, agentLocalDir}
    \* attestationKeyDir is included as a Project/Read choice so TLC actually exercises
    \* "key dir chosen as ProjectDir / a ReadDir" and proves the section-8 deny dominates.
    ProjectChoices = {normalProj, agentHome, sshDir, configDir, hostTempRoot, hostTempOutside, attestationKeyDir}
    ReadChoices    = {normalProj, agentHome, outsideRef, hostTempRoot, attestationKeyDir}
    NetworkChoices = {"default", "none"}
    ResumeChoices  = {invokerSess, outsideRef, "none"}
    TempSocketPaths = {codexTempSocket}
    HostAuthorityPaths   = {attestationKeyDir}
    HostAuthorityTargets = {attestationKeyDir, attestationKeyFile}

INVARIANTS
    TypeOK
    CredentialReadDenied
    CredentialWriteDenied
    AttestationKeyReadDenied
    AttestationKeyWriteDenied
    AgentKeychainExceptionScoped
    ReadDirsNoWrite
    NoBroadAgentHomeAllow
    AgentHomeSubsUsable
    UnlistedAgentHomeNotImplicitlyReadable
    UnlistedAgentHomeNotImplicitlyWritable
    UnlistedAgentHomeNotImplicitlyExecutable
    ProjectDirWritable
    ReadDirSubsumption
    ResumeDirNotCredential
    HostTempNotImplicitlyReadable
    HostTempNotImplicitlyWritable
    HostTempNotImplicitlyExecutable
    SessionTempWritable
    ClaudeRuntimeTempScoped
    TempSocketsDenied
    NetworkNoneDeniesOutbound
    NetworkNoneDeniesDNS
    NetworkDefaultAllowsOutbound
