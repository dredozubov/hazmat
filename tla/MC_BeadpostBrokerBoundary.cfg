\* Model configuration for MC_BeadpostBrokerBoundary
\*
\* Run:
\*   ./run_tlc.sh -workers auto -config MC_BeadpostBrokerBoundary.cfg MC_BeadpostBrokerBoundary.tla

SPECIFICATION Spec

CONSTANTS
    Sessions       = {s1, s2}
    Projects       = {pa, pb}
    Tiers          = {tNative, tDocker}
    BrokerSockets  = {k1, k2}
    RequestContent = {req}
    NoSocket       = NoSocket
    NoAuthority    = NoAuthority
    NoContent      = NoContent

INVARIANTS
    TypeOK
    BrokerSocketOnlyAfterConfirmedSession
    AcceptedRequestHasConfirmedSession
    AgentCannotSupplyAuthorityFields
    AcceptedAuthorityEqualsLaunchFacts
    NoCrossSessionRequest
    NoRequestAfterSessionClose
    HostAuthorityNeverAgentReadable
    DeliveryOnlyFromAcceptedRequest
