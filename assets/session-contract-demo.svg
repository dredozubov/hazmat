<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Hazmat first contained session terminal demo</title>
  <desc id="desc">A terminal screenshot showing Hazmat setup preview, init with Claude bootstrap, and a native containment session contract printed before launch.</desc>
  <rect width="1120" height="720" rx="18" fill="#111318"/>
  <rect x="28" y="28" width="1064" height="664" rx="12" fill="#171a21" stroke="#303642"/>
  <circle cx="58" cy="57" r="7" fill="#ff5f57"/>
  <circle cx="82" cy="57" r="7" fill="#ffbd2e"/>
  <circle cx="106" cy="57" r="7" fill="#28c840"/>
  <text x="554" y="63" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#9aa4b2">hazmat quickstart</text>

  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <text x="58" y="112" fill="#7dd3fc">$</text>
    <text x="86" y="112" fill="#f8fafc">brew install dredozubov/tap/hazmat</text>
    <text x="58" y="146" fill="#8bdc97">hazmat was successfully installed</text>

    <text x="58" y="188" fill="#7dd3fc">$</text>
    <text x="86" y="188" fill="#f8fafc">hazmat init --dry-run</text>
    <text x="58" y="222" fill="#8bdc97">setup preview: no host changes applied</text>

    <text x="58" y="270" fill="#7dd3fc">$</text>
    <text x="86" y="270" fill="#f8fafc">hazmat init --bootstrap-agent claude</text>
    <text x="58" y="304" fill="#8bdc97">[ok] setup complete: agent user, helper, firewall ready</text>

    <text x="58" y="352" fill="#7dd3fc">$</text>
    <text x="86" y="352" fill="#f8fafc">cd ~/workspace/my-app</text>
    <text x="58" y="386" fill="#7dd3fc">$</text>
    <text x="86" y="386" fill="#f8fafc">hazmat explain</text>

    <text x="58" y="436" fill="#f8fafc">hazmat: session</text>
    <text x="86" y="470" fill="#a7b0bd">Mode:</text>
    <text x="420" y="470" fill="#f8fafc">Native containment</text>
    <text x="86" y="504" fill="#a7b0bd">Why this mode:</text>
    <text x="420" y="504" fill="#f8fafc">native default</text>
    <text x="86" y="538" fill="#a7b0bd">Project (read-write):</text>
    <text x="420" y="538" fill="#f8fafc">~/workspace/my-app</text>
    <text x="86" y="572" fill="#a7b0bd">Integrations:</text>
    <text x="420" y="572" fill="#f8fafc">node</text>
    <text x="86" y="606" fill="#a7b0bd">Read-only extensions:</text>
    <text x="420" y="606" fill="#f8fafc">none</text>
    <text x="86" y="640" fill="#a7b0bd">Pre-session snapshot:</text>
    <text x="420" y="640" fill="#f8fafc">on</text>
    <text x="58" y="674" fill="#8bdc97">ready to launch Claude Code as /Users/agent...</text>
  </g>
</svg>
